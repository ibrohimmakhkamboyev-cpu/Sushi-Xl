name: sushi_xl
publish_to: "none"
description: Sushi-XL ordering app
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  dio: ^5.4.0
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  shared_preferences: ^2.2.3
  yandex_mapkit: 4.2.1
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  cloud_firestore: ^6.0.3
  flutter_local_notifications: ^19.5.0
  geocoding: ^4.0.0
  webview_flutter: ^4.8.0
  permission_handler: ^11.3.1
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/menu_import.csv
    - assets/yandex_map.html
